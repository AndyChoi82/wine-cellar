// Firestore 저장/불러오기
async function cloudLoad(uid) {
  try {
    const snap = await db.collection("users").doc(uid).get();
    return snap.exists ? snap.data() : null;
  } catch(e) { console.error("load error", e); return null; }
}
function cloudSave(uid, data) {
  db.collection("users").doc(uid).set(data).catch(e => console.error("save error", e));
}

// ─── 유틸 ──────────────────────────────────────────
function calcMat(type, vintage, region="") {
  const yr = parseInt(vintage); if (!yr) return "어린 와인";
  const age = CY - yr;
  const p = /bordeaux|burgundy|napa|barossa|tuscany|rioja|champagne|rhone/i.test(region);
  const w = ({Red:p?[5,9,18,26]:[2,4,10,15],White:p?[2,5,12,18]:[1,2,6,9],Sparkling:[2,4,12,18],Rosé:[0,1,3,5],Orange:[1,2,6,10]})[type]||[2,4,10,15];
  if(age<=w[1]) return "어린 와인";
  if(age<=w[2]) return "숙성됨";
  if(age<=w[3]) return "최고점";
  return "감퇴";
}
function drinkWin(type, vintage, region="") {
  const yr = parseInt(vintage); if (!yr) return "정보 없음";
  const p = /bordeaux|burgundy|napa|barossa|tuscany|rioja|champagne|rhone/i.test(region);
  const r = ({Red:p?[5,18]:[2,10],White:p?[2,12]:[1,6],Sparkling:[2,12],Rosé:[1,3],Orange:[1,6]})[type]||[2,10];
  return `${yr+r[0]}–${yr+r[1]}`;
}

// ─── 와인 DB ────────────────────────────────────────
let _db=null, _loading=false, _cbs=[];
async function loadDB() {
  if(_db) return _db;
  if(_loading) return new Promise(r=>_cbs.push(r));
  _loading=true;
  const list=[];
  await Promise.allSettled(WINE_APIS.map(async({url,type})=>{
    try{
      const d=await(await fetch(url)).json();
      if(Array.isArray(d)) d.forEach(w=>{
        if(w&&w.wine&&w.winery){
          const [region="",country=""]=(w.location||"").split(",").map(s=>s.trim());
          list.push({_id:`${type}-${w.id}`,producer:w.winery,name:w.wine,region,country,type,imageUrl:w.image||"",apiRating:w.rating?.average||""});
        }
      });
    }catch{}
  }));
  _db=list; _loading=false; _cbs.forEach(r=>r(list)); _cbs=[];
  return list;
}
function searchDB(db,q){
  if(!q||q.length<2) return [];
  const lq=q.toLowerCase();
  return db.filter(w=>w.name.toLowerCase().includes(lq)||w.producer.toLowerCase().includes(lq)||w.region.toLowerCase().includes(lq)).slice(0,10);
}

// ─── Donut SVG ──────────────────────────────────────
function DonutChart({data, size=210}) {
  const cx=size/2, cy=size/2, r=size*0.36, sw=size*0.155, C=2*Math.PI*r;
  const total=data.reduce((s,d)=>s+d.value,0);
  let angle=0;
  const segs=data.filter(d=>d.value>0).map(d=>{const seg={...d,frac:d.value/total,sa:angle};angle+=seg.frac*360;return seg;});
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#EEE9E4" strokeWidth={sw}/>
      {segs.map((s,i)=><circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth={sw} strokeDasharray={`${s.frac*C} ${C}`} transform={`rotate(${s.sa-90},${cx},${cy})`}/>)}
      <text x={cx} y={cy-4} textAnchor="middle" fontSize="28" fontWeight="700" fill="#1C1C1E">{total}</text>
      <text x={cx} y={cy+17} textAnchor="middle" fontSize="13" fill="#8A8A8E">병</text>
    </svg>
  );
}

function AddModal({onClose, onAdd}) {
  const [step,setStep]=useState("choose");
  const [form,setForm]=useState(EMPTY);
  const [dbLoading,setDbLoading]=useState(false);
  const [query,setQuery]=useState("");
  const [results,setResults]=useState([]);
  const dbRef=useRef(null);

  const getDB=async()=>{
    if(dbRef.current) return dbRef.current;
    setDbLoading(true);
    const data=await loadDB();
    dbRef.current=data; setDbLoading(false);
    return data;
  };
  useEffect(()=>{
    const t=setTimeout(async()=>{
      if(query.length<2){setResults([]);return;}
      const data=dbRef.current||await getDB();
      setResults(searchDB(data,query));
    },350);
    return()=>clearTimeout(t);
  },[query]);

  const pick=w=>{setForm(f=>({...f,producer:w.producer,name:w.name,region:w.region,country:w.country,type:w.type,imageUrl:w.imageUrl}));setStep("form");};

    if(!form.name.trim()) return;
    onAdd({...form,id:Date.now(),purchasePrice:parseFloat(form.purchasePrice)||0,quantity:parseInt(form.quantity)||1,maturity:calcMat(form.type,form.vintage,`${form.region} ${form.country}`),addedAt:new Date().toLocaleDateString("ko-KR")});

  };

    <Sheet onClose={onClose}>

          <div style={{display:"flex",justifyContent:"center",marginBottom:12}}>

          <div style={{display:"flex",flexWrap:"wrap",gap:10,justifyContent:"center"}}>
            {(tab==="composition"?typeData:matData).map((d,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,fontSize:12}}><div style={{width:9,height:9,borderRadius:"50%",background:d.color}}/>{d.name} {d.value}병</div>)}
          </div>
        </div>
      </>}
      {tab==="financial"&&<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          {[["총 보유",`${total}병`],["총 구매가",totalVal?`${Math.round(totalVal/10000)}만원`:"--"],["평균가",total&&totalVal?`${Math.round(totalVal/total/1000)}천원`:"--"],["종류",`${[...new Set(wines.map(w=>w.type))].length}가지`]].map(([l,v])=>(
            <div key={l} style={{background:"#fff",borderRadius:14,padding:"16px 18px",border:"1px solid #E8E4DE"}}><div style={{fontSize:12,color:"#8A8A8E",marginBottom:8}}>{l}</div><div style={{fontSize:20,fontWeight:700}}>{v}</div></div>

            return<div key={t} style={{marginBottom:14}}><div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:5}}><span>{T_LABEL[t]}</span><span style={{color:"#8A8A8E"}}>{c}병 ({p}%)</span></div><div style={{background:"#EEE9E4",borderRadius:6,height:7}}><div style={{background:T_CHART[i],width:`${p}%`,height:7,borderRadius:6}}/></div></div>;

      );})}
    </div>
  );
}

// ─── 메인 앱 ────────────────────────────────────────
function App() {
  const [authReady, setAuthReady] = useState(false);
  const [user,      setUser]      = useState(null);
  const [loginLoading, setLoginLoading] = useState(false);
  const [loginError,   setLoginError]   = useState("");
  const [dataReady, setDataReady] = useState(false);
  const [wines,    setWines]    = useState([]);
  const [consumed, setConsumed] = useState([]);
  const [page,     setPage]     = useState("wine");
  const [subTab,   setSubTab]   = useState("mywine");
  const [statsTab, setStatsTab] = useState("composition");
  const [showAdd,  setShowAdd]  = useState(false);
  const [detail,   setDetail]   = useState(null);
  const [showShare,setShowShare]= useState(false);
  const [isShared, setIsShared] = useState(false);
  const [sharedWines,setSharedWines]=useState([]);
  const [toast,    setToast]    = useState("");
  const [search,   setSearch]   = useState("");
  const [typeFilter,setTypeFilter]=useState("All");
  const saveTimer = useRef(null);

  // 공유 URL 체크
  useEffect(()=>{
    const hash=window.location.hash;
    // 짧은 공유 링크 (#s=xxxxxx)
    if(hash.startsWith("#s=")) {
      const id = hash.slice(3);
      setAuthReady(true);
      loadShareLink(id).then(wines => {
        if(wines) { setIsShared(true); setSharedWines(wines); }
        else { alert("공유 링크를 찾을 수 없습니다."); window.location.hash=""; }
      });
      return;
    }
    // 구형 긴 공유 링크 (#share=...) 하위 호환
    if(hash.startsWith("#share=")){
      try{
        const data=JSON.parse(decodeURIComponent(atob(hash.slice(7))));
        if(Array.isArray(data)){setIsShared(true);setSharedWines(data);setAuthReady(true);return;}
      }catch{}
    }
    // Firebase 인증 상태 감지
    const unsubscribe = auth.onAuthStateChanged(async (u) => {
      setUser(u);
      setAuthReady(true);
      if (u) {
        // 로그인됨 → Firestore에서 데이터 불러오기
        const saved = await cloudLoad(u.uid);
        setWines(saved?.wines || SAMPLE);
        setConsumed(saved?.consumed || []);
        setDataReady(true);
      } else {
        // 로그아웃 상태
        setWines([]);
        setConsumed([]);
        setDataReady(false);
      }
    });
    return () => unsubscribe();
  }, []);

  // 데이터 변경 시 자동 저장 (1.5초 debounce)
  useEffect(()=>{
    if(!user||!dataReady) return;
    clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(()=>cloudSave(user.uid,{wines,consumed}),1500);
  },[wines,consumed]);

  const notify = msg => {setToast(msg);setTimeout(()=>setToast(""),2400);};

  const handleLogin = async () => {
    setLoginLoading(true);
    setLoginError("");
    try {
      await auth.signInWithPopup(googleProvider);
    } catch(e) {
      setLoginError("로그인 실패: " + (e.message||"다시 시도해주세요"));
    }
    setLoginLoading(false);
  };

  const handleLogout = async () => {
    if(!window.confirm("로그아웃 하시겠습니까?")) return;
    await auth.signOut();
  };

  const handleAdd    = w => {setWines(p=>[w,...p]);notify("셀러에 추가됐습니다!");};
  const handleDrink  = (wine,note,rating) => {
    const today=new Date().toLocaleDateString("ko-KR");
    setConsumed(p=>[{...wine,drunkAt:today,drinkNote:note,drinkRating:rating},...p]);
    setWines(p=>p.filter(w=>w.id!==wine.id));
    setDetail(null);notify("마신 와인으로 기록됐습니다!");
  };
  const handleDelete = id => {setWines(p=>p.filter(w=>w.id!==id));setDetail(null);notify("삭제됐습니다");};
  const shareList = async () => {
    setShowShare(false);
    notify("공유 링크 생성 중...");
    try {
      const url = await createShareLink(wines);
      await navigator.clipboard.writeText(url);
      notify("공유 링크 복사 완료!");
    } catch(e) {
      notify("공유 링크 생성 실패");
      console.error(e);
    }
  };

  const filtered=wines.filter(w=>{
    const s=search.toLowerCase();
    return(!s||[w.name,w.producer,w.region,w.country,w.grapes].some(v=>v?.toLowerCase().includes(s)))&&(typeFilter==="All"||w.type===typeFilter);
  });

  // 로딩 중
  if(!authReady) return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",background:"#F4F2EF",gap:12}}>
      <div style={{fontSize:40}}>🍷</div>
      <div style={{fontSize:14,color:"#8A8A8E"}}>불러오는 중...</div>
    </div>
  );

  // 공유 뷰 (읽기 전용)
  if(isShared) return(
    <div style={{width:"100%",maxWidth:430,margin:"0 auto",minHeight:"100vh",background:"#F4F2EF"}}>
      <div style={{background:"#1C1C1E",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span>👁</span>
          <div><div style={{fontSize:13,fontWeight:700,color:"#fff"}}>공유된 셀러</div><div style={{fontSize:11,color:"rgba(255,255,255,.5)"}}>읽기 전용</div></div>
        </div>
        <div style={{background:"rgba(255,255,255,.12)",borderRadius:20,padding:"4px 12px",fontSize:11,color:"rgba(255,255,255,.7)",fontWeight:600}}>{sharedWines.length}병</div>
      </div>
      <div style={{padding:"16px 20px 40px"}}>
        {sharedWines.map((wine,i)=>(
          <div key={i} style={{background:"#fff",borderRadius:14,marginBottom:12,border:"1px solid #E8E4DE",overflow:"hidden"}}>
            <div style={{display:"flex",gap:14,padding:"14px 16px 12px"}}>
              <WineImg url={wine.imageUrl} wine={wine}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,color:"#8A8A8E",marginBottom:3}}>{wine.producer}</div>
                <div style={{fontSize:16,fontWeight:700,color:"#1C1C1E",marginBottom:4,lineHeight:1.3}}>{wine.name}</div>
                <div style={{fontSize:12,color:"#8A8A8E",marginBottom:9}}>{[wine.region,wine.country].filter(Boolean).join(", ")}</div>
                <MatBadge mat={wine.maturity}/>
              </div>
            </div>
            <div style={{background:"#F6F4F0",borderTop:"1px solid #E8E4DE",padding:"8px 16px",fontSize:12,color:"#8A8A8E"}}>
              음용 적기: <span style={{color:"#C07840",fontWeight:600}}>{drinkWin(wine.type,wine.vintage,wine.region)}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  // 로그인 화면
  if(!user) return <LoginScreen onLogin={handleLogin} loading={loginLoading} error={loginError}/>;

  // 메인 앱
  return(
    <div style={{width:"100%",maxWidth:430,margin:"0 auto",minHeight:"100vh",background:"#F4F2EF",color:"#1C1C1E"}}>
      <div style={{height:50}}/>

      {page==="wine"&&<>
        <div style={{padding:"0 20px 14px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <div>
              <div style={{fontSize:26,fontWeight:700}}>내 와인</div>
              <div style={{display:"flex",alignItems:"center",gap:6,marginTop:3}}>
                {user.photoURL&&<img src={user.photoURL} style={{width:16,height:16,borderRadius:"50%"}}/>}
                <span style={{fontSize:11,color:"#8A8A8E"}}>{user.displayName||user.email}</span>
                <span onClick={handleLogout} style={{fontSize:11,color:"#C07840",cursor:"pointer",textDecoration:"underline"}}>로그아웃</span>
              </div>
            </div>
            <div style={{display:"flex",gap:10,alignItems:"center"}}>
              <button onClick={()=>setShowShare(true)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,padding:"4px",color:"#1C1C1E"}}>↗</button>
              <button onClick={()=>setShowAdd(true)} style={{background:"#1C1C1E",border:"none",borderRadius:10,width:36,height:36,color:"#fff",fontSize:24,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
            </div>
          </div>
          <div style={{display:"flex",background:"#EAE6E0",borderRadius:14,padding:4,marginBottom:14}}>
            {[["record","기록"],["mywine","내 와인"],["wishlist","위시리스트"]].map(([k,l])=>(
              <button key={k} onClick={()=>setSubTab(k)} style={{flex:1,padding:"9px 4px",borderRadius:10,border:"none",cursor:"pointer",background:subTab===k?"#C07840":"transparent",color:subTab===k?"#fff":"#8A8A8E",fontSize:13,fontWeight:subTab===k?700:400,transition:"all .2s"}}>{l}</button>
            ))}
          </div>
          {subTab==="mywine"&&<>
            <div style={{position:"relative",marginBottom:10}}>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="와인, 생산자, 지역 검색..." style={{width:"100%",boxSizing:"border-box",background:"#fff",border:"1px solid #DDD9D3",borderRadius:10,padding:"10px 13px 10px 38px",fontSize:14,outline:"none",color:"#1C1C1E"}}/>
              <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:"#8A8A8E",fontSize:14}}>🔍</span>
            </div>
            <div style={{display:"flex",gap:7,overflowX:"auto",paddingBottom:4,scrollbarWidth:"none"}}>
              {["All",...TYPES].map(t=>{const act=typeFilter===t,h=T_HUE[t]||"#C07840";
                return<button key={t} onClick={()=>setTypeFilter(t)} style={{whiteSpace:"nowrap",borderRadius:20,padding:"5px 13px",fontSize:12,fontWeight:600,cursor:"pointer",border:act?`1.5px solid ${h}`:"1px solid #DDD9D3",background:"#fff",color:act?h:"#8A8A8E"}}>{t==="All"?"전체":T_LABEL[t]}</button>;
              })}
            </div>
          </>}
        </div>
        <div style={{padding:"4px 20px 110px"}}>
          {subTab==="mywine"&&(filtered.length===0
            ?<div style={{textAlign:"center",padding:"70px 0",color:"#8A8A8E"}}><div style={{fontSize:44,marginBottom:14}}>🍷</div><div style={{fontSize:15,fontWeight:600,marginBottom:6}}>{search?"검색 결과 없음":"셀러가 비어있어요"}</div><div style={{fontSize:13}}>+ 버튼으로 와인을 추가해보세요</div></div>
            :filtered.map(w=><WineCard key={w.id} wine={w} onClick={setDetail}/>)
          )}
          {subTab==="record"&&(consumed.length===0
            ?<div style={{textAlign:"center",padding:"70px 0",color:"#8A8A8E"}}><div style={{fontSize:44,marginBottom:14}}>🫗</div><div style={{fontSize:15,fontWeight:600,marginBottom:6}}>마신 와인 기록이 없습니다</div></div>
            :consumed.map((w,i)=><ConsumedCard key={i} wine={w}/>)
          )}
          {subTab==="wishlist"&&<div style={{textAlign:"center",padding:"70px 0",color:"#8A8A8E"}}><div style={{fontSize:44,marginBottom:14}}>⭐</div><div style={{fontSize:15,fontWeight:600}}>위시리스트가 비어있습니다</div></div>}
        </div>
      </>}

      {page==="stats"&&<>
        <div style={{padding:"0 20px 18px"}}><div style={{fontSize:26,fontWeight:700,marginBottom:4}}>통계</div></div>
        <StatsPage wines={wines} tab={statsTab} setTab={setStatsTab}/>
      </>}

      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"#fff",borderTop:"1px solid #E8E4DE",display:"flex",padding:"10px 0 max(30px,env(safe-area-inset-bottom))",zIndex:100}}>
        {[["wine","🍾","내 와인"],["stats","📊","통계"]].map(([p,icon,label])=>(
          <button key={p} onClick={()=>setPage(p)} style={{flex:1,background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,color:page===p?"#C07840":"#8A8A8E"}}>
            <span style={{fontSize:22}}>{icon}</span><span style={{fontSize:11,fontWeight:page===p?700:400}}>{label}</span>
          </button>
        ))}
      </div>

      {toast&&<div style={{position:"fixed",bottom:86,left:"50%",transform:"translateX(-50%)",background:"#1C1C1E",color:"#fff",padding:"10px 22px",borderRadius:22,fontSize:13,fontWeight:600,zIndex:300,whiteSpace:"nowrap",boxShadow:"0 4px 20px rgba(0,0,0,.25)"}}>{toast}</div>}

      {showAdd&&<AddModal onClose={()=>setShowAdd(false)} onAdd={handleAdd}/>}
      {detail&&<DetailModal wine={detail} onClose={()=>setDetail(null)} onDrink={(n,r)=>handleDrink(detail,n,r)} onDelete={()=>handleDelete(detail.id)}/>}
      {showShare&&<Sheet onClose={()=>setShowShare(false)}>
        <div style={{fontSize:20,fontWeight:700,marginBottom:8}}>셀러 공유하기</div>
        <div style={{fontSize:13,color:"#8A8A8E",lineHeight:1.7,marginBottom:20}}>링크를 받은 분은 <strong style={{color:"#1C1C1E"}}>읽기 전용</strong>으로 볼 수 있습니다.<br/>현재 <strong style={{color:"#1C1C1E"}}>{wines.length}병</strong> 공유</div>
        <button onClick={shareList} style={{width:"100%",background:"#C07840",border:"none",borderRadius:14,padding:"15px",color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>공유 링크 복사하기</button>
      </Sheet>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
